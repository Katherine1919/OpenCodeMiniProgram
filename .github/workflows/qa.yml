name: UTM Linter QA

on:
  push:
    paths:
      - "utm-linter/**"
      - "extension/**"
      - ".github/workflows/qa.yml"
  pull_request:
    paths:
      - "utm-linter/**"
      - "extension/**"
      - ".github/workflows/qa.yml"
  workflow_dispatch:
  schedule:
    # UTC 时间；避开整点拥堵（17分）
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: utm-linter-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect app directory (utm-linter first, then extension)
        id: detect
        shell: bash
        run: |
          if [ -f "utm-linter/package.json" ]; then
            APP_DIR="utm-linter"
          elif [ -f "extension/package.json" ]; then
            APP_DIR="extension"
          else
            echo "❌ Neither 'utm-linter/package.json' nor 'extension/package.json' exists."
            echo "Top-level files:"
            ls -la
            echo "Find package.json (depth<=4):"
            find . -maxdepth 4 -name package.json -print
            exit 1
          fi

          echo "✅ Using APP_DIR=$APP_DIR"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ${{ steps.detect.outputs.app_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Node: $(node -v)"
          echo "NPM : $(npm -v)"
          echo "PWD : $(pwd)"

          # 先尝试 lockfile 严格安装；失败则回退到 install（更容错）
          if [ -f package-lock.json ]; then
            npm ci --omit=optional || npm install --omit=optional
          else
            npm install --omit=optional
          fi

      - name: Install Playwright Chromium
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: npx playwright install --with-deps chromium

      - name: Run UTM tests
        working-directory: ${{ steps.detect.outputs.app_dir }}
        shell: bash
        run: |
          if npm run | grep -q "test:utm"; then
            npm run test:utm
          elif [ -f "tests/utm-linter.spec.ts" ]; then
            npx playwright test tests/utm-linter.spec.ts
          else
            npx playwright test
          fi

      - name: Run summary (optional)
        if: always()
        working-directory: ${{ steps.detect.outputs.app_dir }}
        shell: bash
        run: |
          if npm run | grep -q "test:utm:summary"; then
            npm run test:utm:summary || true
          elif [ -f "scripts/summarize-utm-report.mjs" ]; then
            node scripts/summarize-utm-report.mjs || true
          else
            echo "No summary script found, skipped."
          fi

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            ${{ steps.detect.outputs.app_dir }}/playwright-report/**
            ${{ steps.detect.outputs.app_dir }}/test-results/**
            ${{ steps.detect.outputs.app_dir }}/test-results/utm-report.json
